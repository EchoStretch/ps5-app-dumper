<section class="card">
  <div class="head"><h2>Access</h2></div>
  <div class="body">
        <div class="row">
          <div class="txt">
            <div class="label">Ask other devices for a code</div>
            <div class="hint" id="require-hint">Phones and PCs may look, but have to enter the code from the TV before they can change anything.</div>
          </div>
          <label class="sw"><input type="checkbox" id="c-require" disabled><span></span></label>
        </div>
        <div class="row" id="row-access" hidden>
          <div class="txt">
            <div class="label">Code for other devices</div>
            <div class="hint" id="access-hint">Phones and PCs enter it once before they may change anything. The console's own browser never has to.</div>
          </div>
          <span class="mono" id="access-code" style="font-family:var(--mono);font-size:18px;letter-spacing:.18em;color:var(--accent)"></span>
        </div>
  </div>
</section>
