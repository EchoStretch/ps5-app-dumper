<script>
/* Flexbox `gap` cannot be asked for with @supports (grid has it too), so it
   is measured: two empty children in a column are as tall as the gap. */
(function(){
  var f = document.createElement("div");
  f.style.cssText = "display:flex;flex-direction:column;row-gap:1px;position:absolute;visibility:hidden";
  f.appendChild(document.createElement("div"));
  f.appendChild(document.createElement("div"));
  document.documentElement.appendChild(f);
  if(f.scrollHeight !== 1) document.documentElement.className += " no-flexgap";
  document.documentElement.removeChild(f);
})();
</script>
