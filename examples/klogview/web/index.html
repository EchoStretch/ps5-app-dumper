<!doctype html>
<html lang="en" manifest="/cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<title>Klog Viewer</title>
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icon.png">
<link rel="manifest" href="/app.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Klog Viewer">
<!-- @WHB:head@ -->
<style>
/* @WHB_CSS@ */

/* ---- what is the viewer's own: a console that gets the room ---- */
body{padding-bottom:24px}
#logbox{height:62vh;min-height:300px;font-size:12px}
#logbox div.hide{display:none}
#logbox div.mark{color:var(--accent);border-top:1px solid var(--line-soft);margin-top:4px;padding-top:5px}
.tools{display:flex;align-items:center;gap:8px;padding:10px 13px;border-top:1px solid var(--line-soft)}
.tools input[type=text]{flex:1;max-width:none;min-width:0}
.tools .count{font-family:var(--mono);font-size:11px;color:var(--ink-faint);white-space:nowrap}
.no-flexgap .tools > * + *{margin-left:8px}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#2f9dff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 7h9"/><path d="M5 12h14"/><path d="M5 17h6"/>
        </svg>
      </div>
      <div>
        <h1>Klog <span>Viewer</span></h1>
        <div class="sub" id="sub">Web console</div>
      </div>
      <div class="link">
        <!-- @WHB:chips@ -->
        <button type="button" class="live menu" id="menubtn" aria-label="Menu" aria-expanded="false"><i class="bars" aria-hidden="true"><b></b><b></b><b></b></i><span>Menu</span></button>
        <div class="menu-pop" id="menupop" hidden>
          <button type="button" data-go="">Log</button>
          <button type="button" data-go="#settings">Settings</button>
        </div>
      </div>
    </div>
  </header>

  <!-- @WHB:offline@ -->

  <main>
    <section class="card">
      <div class="head"><h2>Kernel log</h2><span class="spacer"></span>
        <button class="ghost act" id="clearlog" style="padding:5px 11px;font-size:11px;letter-spacing:.1em">Clear</button>
      </div>
      <div id="logbox"><div class="empty">waiting for the kernel to say something…</div></div>
      <div class="tools">
        <input type="text" id="k-filter" placeholder="show only lines containing…" spellcheck="false" autocomplete="off">
        <span class="count" id="k-count"></span>
        <button type="button" class="mini" id="k-mark" title="Puts a line of your own into the log, to find this moment again">Mark</button>
      </div>
    </section>
  </main>

  <div class="page" id="view-settings" hidden>
    <div class="pagehead">
      <button type="button" class="mini" data-back="1">&larr; Back</button>
      <h2>Settings</h2>
    </div>

    <section class="card">
      <div class="head"><h2>Payload</h2></div>
      <div class="body">
        <div class="row">
          <div class="txt">
            <div class="label">Write the log to a file</div>
            <div class="hint">Every line also goes to logs/klog.txt in the payload's data folder.</div>
          </div>
          <label class="sw"><input type="checkbox" id="c-save"><span></span></label>
        </div>
        <!-- @WHB:row-tile@ -->
        <!-- @WHB:row-store@ -->
      </div>
    </section>

    <!-- @WHB:access@ -->
  </div>

  <footer>KLOG VIEWER &middot; a webhb example &middot; GPL-3.0 &middot;
    <!-- @WHB:foot@ -->
  </footer>
</div>

<!-- @WHB:unlock@ -->

<!-- @WHB:toast@ -->

<script>
(function(){
"use strict";

/* @WHB_JS@ */

/* ---------------- the viewer's own ---------------- */
var shown = 0, total = 0;

function matches(line){
  var f = $("k-filter").value.toLowerCase();
  return !f || line.toLowerCase().indexOf(f) >= 0;
}
function count(){
  $("k-count").textContent = $("k-filter").value ? shown + " of " + total : total + " lines";
}
/* every line the kit puts into the console passes through here */
function onLog(el, line){
  total++;
  if(line.indexOf("========") === 0) el.className = "mark";
  if(matches(line)) shown++; else el.className += " hide";
  count();
}
function refilter(){
  shown = total = 0;
  Array.prototype.forEach.call($("logbox").children, function(el){
    if(el.classList.contains("empty")) return;
    total++;
    var ok = matches(el.textContent);
    el.classList.toggle("hide", !ok);
    if(ok) shown++;
  });
  count();
}

function applyConfig(c){ $("c-save").checked = !!c.saveToFile; }
function loadConfig(){ api(WHB_API + "/config").then(applyConfig).catch(function(){}); }

$("k-filter").addEventListener("input", refilter);
$("clearlog").addEventListener("click", function(){ shown = total = 0; count(); });
$("k-mark").addEventListener("click", function(){
  post("/api/klog/mark", { text: $("k-filter").value || "mark" }).catch(function(e){ toast(e.message, "bad"); });
});
$("c-save").addEventListener("change", function(){
  post(WHB_API + "/config", { saveToFile: $("c-save").checked ? 1 : 0 }).then(function(r){
    applyConfig(r.config);
    toast(r.config.saveToFile ? "Writing to logs/klog.txt" : "No longer writing to a file", "ok");
  }).catch(function(e){ toast(e.message, "bad"); loadConfig(); });
});

whb.app = {
  name: "Klog Viewer",
  elf: "klogview", shortName: "Klog Viewer", storage: "klogview",
  busyText: "", afterBusy: "",
  views: { "#settings": "view-settings" }, settingsView: "view-settings",
  onLog: onLog,
  onOnline: loadConfig,
  onConfig: applyConfig
};
whbBoot();

loadConfig();
whbPoll();
setInterval(whbPoll, 1000);
})();
</script>
</body>
</html>
