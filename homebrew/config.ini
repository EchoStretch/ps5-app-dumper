; PS5 App Dumper Config
; Managed by the web UI - hand edits are picked up on the next start.

; === Web UI ===
; enable_webui = 1 -> serve the web interface (default)
; enable_webui = 0 -> headless, dump the running app right away
; auto_start   = 1 -> dump the running game right at launch; the web UI comes
;                     up as well, to watch it, stop it or switch this off
; web_port          -> first TCP port tried for the web interface (default 8081)
enable_webui = 1
auto_start = 0
web_port = 8081

; === Destination ===
; dump_subdir -> folder below the mount point that receives the dump
dump_subdir = homebrew

; === Dump Queue ===
; queue_delay -> seconds a queued title gets to load before it is dumped (5-600)
queue_delay = 30

; === Decrypt App ===
; enable_decrypter = 1  -> decrypt ELF files (default)
; enable_decrypter = 0  -> disable decryption
enable_decrypter = 1

; === Backport Options PS4/PS5 ===
; enable_backport = 1 -> enable SDK patching
; enable_backport = 0 -> disable SDK patching (default)
; ps4_backport_level = 1-6 -> predefined SDK pair (default: 4 (PS4 9.00) )
; ps5_backport_level = 1-10 -> predefined SDK pair (default: 1 (PS5 1.00) )
; >>>> BACKPORTING IS FOR ADVANCED USERS MAY NOT WORK <<<<
enable_backport = 0
ps4_backport_level = 4
ps5_backport_level = 1

; === FSELF Files ===
; enable_elf2fself = 1 -> enable fself ELF files
; enable_elf2fself = 0 -> disable fself (default)
enable_elf2fself = 0

; === Logging ===
; enable_logging = 1 -> write log.txt (default)
; enable_logging = 0 -> disable logging
enable_logging = 1

; === PS4 Split Mode ===
; 0 = no split (CUSAxxxxx/)
; 1 = app only (CUSAxxxxx-app/)
; 2 = patch only (CUSAxxxxx-patch/)
; 3 = both split (CUSAxxxxx-app/ + CUSAxxxxx-patch/)
split = 3
